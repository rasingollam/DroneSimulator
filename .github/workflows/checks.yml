name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physics-controller-and-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Godot baseline
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip \
            --output "$RUNNER_TEMP/godot/engine.zip"
          unzip -q "$RUNNER_TEMP/godot/engine.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64"
      - name: Run physics, controller, network and artifact checks
        shell: bash
        env:
          GODOT_BIN: ${{ runner.temp }}/godot/Godot_v4.5.1-stable_linux.x86_64
          JSON_JAR: ${{ runner.temp }}/json-20240303.jar
        run: |
          curl --fail --location --retry 3 \
            https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar \
            --output "$JSON_JAR"
          echo "3cf6cd6892e32e2b4c1c39e0f52f5248a2f5b37646fdfbb79a66b46b618414ed  $JSON_JAR" | sha256sum --check
          python3 --version
          java -version
          python3 tests/run_checks.py
